name: Publish Qwen 3.8 team site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4
      - name: Stage standalone team site
        shell: bash
        run: |
          mkdir -p _site/assets
          cp team_site/index.html _site/index.html
          cp team_site/assets/videoframe_40129.png _site/assets/videoframe_40129.png
      - name: Upload standalone team site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
